name: Deploy Backend to Render

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify environment variables
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
          echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set"
          exit 1
        fi
        echo "Environment variables verified successfully"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        echo "Building Docker image from Backend/Dockerfile..."
        docker build -t backend-app:latest -f Backend/Dockerfile ./Backend
        echo "Docker image built successfully"
      
    - name: Deploy to Render
      run: |
        echo "Triggering deployment to Render via deploy hook..."
        RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 60 --fail -X POST "${RENDER_DEPLOY_HOOK_URL}" || true)
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n-1)
        
        echo "Response: $BODY"
        
        if [[ "$HTTP_CODE" =~ ^[0-9]+$ ]] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "✓ Deployment triggered successfully (HTTP $HTTP_CODE)"
        else
          echo "✗ Deployment failed with HTTP code: $HTTP_CODE"
          exit 1
        fi
