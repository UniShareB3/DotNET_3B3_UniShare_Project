name: Deploy Backend to Render

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Verify environment variables
      run: |
        if [ -z "$RENDER_API_KEY" ]; then
          echo "Error: RENDER_API_KEY secret is not set"
          exit 1
        fi
        if [ -z "$RENDER_SERVICE_ID" ]; then
          echo "Error: RENDER_SERVICE_ID secret is not set"
          exit 1
        fi
        echo "Environment variables verified successfully"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        echo "Building Docker image from Backend/Dockerfile..."
        docker build -t backend-app:latest -f Backend/Dockerfile ./Backend
        echo "Docker image built successfully"
      
    - name: Deploy to Render
      run: |
        echo "Triggering deployment to Render service: ${RENDER_SERVICE_ID}"
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${RENDER_API_KEY}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": "do_not_clear"}')
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | head -n-1)
        
        echo "Response: $BODY"
        
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "✓ Deployment triggered successfully (HTTP $HTTP_CODE)"
        else
          echo "✗ Deployment failed with HTTP code: $HTTP_CODE"
          exit 1
        fi
